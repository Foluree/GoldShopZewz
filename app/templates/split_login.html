<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autorization - Split Reality</title>
    <link rel="stylesheet" href="/static/split_login.css">
</head>
<body>
    <nav class="page-nav" aria-label="Navigation Login">
        <a class="page-nav__link" href="/">←At home</a>
        <a class="page-nav__link" href="/profile">👤 In the profile</a>
    </nav>

    <div class="layout">
        <section class="world" id="worldScene">
            <div class="orbs">
                <div class="orb one"></div>
                <div class="orb two"></div>
                <div class="orb three"></div>
            </div>
            <div class="grid"></div>
            <div class="overlay"></div>
            <div class="caption">
                <h1>Split Reality</h1>
                <p>Слева мир, который реагирует на твои действия. Справа - строгий вход в систему.</p>
            </div>
        </section>

        <section class="auth">
            <form class="card" id="loginFrom" autocomplete="off">
                <h2>Enterence</h2>
                <p class="subtitle">Черный экран авторизации без серверной проверки.</p>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email_us" type="email" placeholder="you@example.com" />
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="passuse" type="password" placeholder="••••••••" />
                </div>

                <div class="auth-switch">
                    <a class="switch-btn" href="/regist/">Create world and accaunt</a>
                </div>

                <button type="submit" class="btn">Login</button>
                <p class="hint" id="statusHint">Начни вводить email, чтобы «собрать» сцену.</p>
            </form>
        </section>
    </div>

    <script src="/scripts/split_login.js"></script>
</body>
</html>
