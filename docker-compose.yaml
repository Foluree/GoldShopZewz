services:
  app:
    build: .
    container_name: goldshop-app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    
  db:
    image: postgres:16-alpine
    container_name: goldshop-db
    environment:
      POSTGRES_DB: ${DBPG_NAME:-goldshop}
      POSTGRES_USER: ${DBPG_USER:-goldshop}
      POSTGRES_PASSWORD: ${DBPG_PASS:-goldshop_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: