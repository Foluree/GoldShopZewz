<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autorization - Split Reality</title>
    <style>
        :root {
            --bg: #0f1220;
            --panel: #171b2e;
            --text: #e9ecff;
            --muted: #9ca7d1;
            --accent: #7f9dff;
            --success: #47d3a6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 10% 10%, #232949 0%, var(--bg) 35%, #0a0d18 100%);
        }

        .layout {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            min-height: 100vh;
        }

        .world {
            position: relative;
            overflow: hidden;
            border-right: 1px solid rgba(255,255,255,.08);
            isolation: isolate;
        }

        .orbs, .overlay {
            position: absolute;
            inset: 0;
        }

        .orb {
            position: absolute;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(127,157,255,.65), rgba(127,157,255,.05));
            filter: blur(2px);
            transition: transform .6s ease, opacity .6s ease;
            opacity: .25;
        }

        .orb.one {  top: 14%; left: 12%; }
        .orb.two { top:52%; left:36% }
        .orb.three { top:20%; left:62%; }

        .grid { 
            position: absolute;
            inset:0;
            background-image:
                linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 95%);
            opacity: .45;
            transform: scale(1.06);
            transition: opacity .5s ease, transform .8s ease;
        }

        .caption {
            position: absolute;
            left: 48px;
            bottom: 42px;
            max-width: 460px;
            z-index: 2;
        }

        .caption h1 {
            margin: 0 0 12px;
            font-size: clamp(1.8rem, 3.2vw, 3rem);
            line-height: 1.1;
        }

        .caption p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .overlay {
            z-index: 3;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(12,14,26,.15),rgba(12,14,26,.75));
            opacity:.3;
            transition: opacity .5s ease, background .5s ease;
        }

        .auth {
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, rgba(23,27,46,.95),rgba(12,14,26,.98));
            padding:36px;
        }

        .card {
            width: min(420px, 100%);
            background: rgba(255,255,255,.02);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
            padding:28px;
            backdrop-filter: blur(6px);
           }

        .card h2 { margin: 0 0 8px; }
        .card .subtitle { margin: 0 0 22px; color: var(--muted); font-size: .95rem; }
        .field { margin-bottom: 14px; }
        .label { display: block; margin-bottom: 6px; color: #c7d2ff; font-size: .9rem; }
        input {
            width: 100%;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 12px;
            background: rgba(255,255,255,.03);
            color: var(--text);
            padding: 12px 14px;
            font-size: 1rem;
            outline: none;
            transition: border-color .25s ease, box-shadow .25s ease;
        }
        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(127,157,255,.2);
        }
        .btn {
            width: 100%;
            border: 0;
            border-radius: 12px;
            padding: 12px 14px;
            color: white;
            background: linear-gradient(90deg, #698bff, #9f74ff);
            cursor: pointer;
            font-weight: 600;
            margin-top: 8px;
            transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(127, 157, 255, .25);
            filter: brightness(1.08);
        }
        .btn:active { transform: translateY(1px) scale(.98); }
        .auth-switch {
            display: flex;
            justify-content: flex-end;
            margin: -2px 0 12px;
        }
        .switch-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #fff7d7;
            text-decoration: none;
            font-weight: 700;
            font-size: .9rem;
            padding: 10px 14px;
            border: 1px solid rgba(255, 216, 119, .38);
            border-radius: 999px;
            background: 
                radial-gradient(circle at 20% 25%, rgba(255, 255, 139, .28), transparent 32%),
                linear-gradient(135deg, rgba(25, 38, 80, .95), rgba(16, 43, 39, .95));
            box-shadow: 0 8px 22px rgba((80,155,255,.14), inset 0 0 12px rgba(255,229,160,.08));
            transition: transform .18s ease, box-shadow .18s ease, border-color .18 ease, filter .18s ease
        }
        .switch-btn::before { content: "☀️🌙"; font-size: .95rem; }
        .switch-btn::after { content: "🏗️"; font-size: .95rem; }
        .switch-btn:hover {
            transform: translateY(-3px);
            border-color: rgba(255,229,160,.75);
            box-shadow: 0 14px 28px rgba(80,155,255,.24), 0 0 18px rgba(255,210,117,.16);
            filter: brightness(1.08);
        }
        .hint { margin-top: 14px; font-size: .9rem; }
        .world.email .grid { opacity: .8; transform: scale(1); }
        .world.email .grid { opacity:.8;transform:scale(1); }
        
        .world.email .orb {
            opacity:.55;
            transform:translateY(-8px); 
        }
        .world.password .overlay{ 
            opacity:.08;
            background: linear-gradient(120deg,rgba(114,84,255,.06),rgba(84,203,255,.2));
        }

        .world.password .orb.two {
            transform: scale(1.18);
            opacity:.78;
        }

        .world.error {
            filter: grayscale(.35);
        }

        .world.error .overlay{
            opacity:.72;
            background:linear-gradient(120deg,rgba(62,17,30,.7),rgba(14,16,22,.9));
        }

        .world.error .orb { opacity:.08; transform: scale(.85); }

        .page-nav {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .page-nav__link {
            min-width: 156px;
            padding: 11px 15px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.18);
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .01em;
            background:
                radial-gradient(circle at 18% 20%, rgba(103,160,255,.24), transparent 32%)
                linear-gradient(135deg, rgba(16,24,42,.88), rgba(9,15,29,.74));
            box-shadow: 0 12px 28px rgba(0,0,0,.26), inset 0 0 14px rgba(255,255,255,.04);
            backdrop-filter: blur(10px);
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, filter .18s ease;
        }

        .page-nav__link:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(103,160,255,.18), 0 10px 24px rgba(0,0,0,.28);
            filter: brightness(1.08);
        }

        .page-nav__link:active { transform: translateY(1px) scale(.98); }

        @media (max-width: 900px) {
            .layout { grid-template-columns:1fr; }
            .world { min-height: 44vh; border-right: 0; border-bottom: 1px solid rgba(255,255,255,.08); }
        }
    </style>
</head>
<body>
    <nav class="page-nav" aria-label="Navigation Login">
        <a class="page-nav__link" href="/">←At home</a>
        <a class="page-nav__link" href="/profile">👤 In the profile</a>
    </nav>

    <div class="layout">
        <section class="world" id="worldScene">
            <div class="orbs">
                <div class="orb one"></div>
                <div class="orb two"></div>
                <div class="orb three"></div>
            </div>
            <div class="grid"></div>
            <div class="overlay"></div>
            <div class="caption">
                <h1>Split Reality</h1>
                <p>Слева мир, который реагирует на твои действия. Справа - строгий вход в систему.</p>
            </div>
        </section>

        <section class="auth">
            <form class="card" id="loginFrom" autocomplete="off">
                <h2>Enterence</h2>
                <p class="subtitle">Черный экран авторизации без серверной проверки.</p>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email_us" type="email" placeholder="you@example.com" />
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="passuse" type="password" placeholder="••••••••" />
                </div>

                <div class="auth-switch">
                    <a class="switch-btn" href="/regist/">Create world and accaunt</a>
                </div>

                <button type="submit" class="btn">Login</button>
                <p class="hint" id="statusHint">Начни вводить email, чтобы «собрать» сцену.</p>
            </form>
        </section>
    </div>

    <script>
        const world = document.getElementById('worldScene');
        const form = document.getElementById('loginFrom');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const hint = document.getElementById('statusHint');

        function updateScense() {
            world.classList.toggle('email',email.value.trim().length > 0);
            world.classList.toggle('password',password.value.trim().length > 0);

            if (!world.classList.contains('error')) {
                if (password.value.trim()) {
                    hint.textContent = 'Пароль активировал свет и движение сцены.';
                } else if (email.value.trim()) {
                    hint.textContent = 'Email начинает собирать мир вокруг формы.';
                } else {
                    hint.textContent = 'Начни вводить email, чтобы «собрать» сцену.';
                }
            }
        }

        email.addEventListener('input', updateScense);
        password.addEventListener('input', updateScense);

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const hasError = !email.value.trim() || !password.value.trim();

            world.classList.toggle('error', hasError);
            if (hasError) {
                hint.textContent = 'Ошибка: заполни оба поля. Мир временно «ломается». ';
                return;
            }

            hint.textContent = 'Демо: форма заполнена. Проверка на сервере пока отключена.';
            setTimeout(() => world.classList.remove('error'), 350);

            try {
                hint.textContent = 'Check database server...';
                const response = await fetch('/login/log', {
                    method: 'POST',
                    headers: {
                        "Content-Type":"application/json",
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        email_us: email.value.trim(),
                        passuse: password.value
                    })
                });
                
                if (!response.ok) {
                    world.classList.add('error');
                    window.textContent = "Incorect email or password."
                    return;
                } 

                hint.textContent = "Enterene complited. Transition the profile..."
                window.location.href = '/profile'
                
            } catch (error) {
                world.classList.add('error');
                hint.textContent = "Ошибка сети. По пробуйте еще раз.";
            } finally {
                setTimeout(() => world.classList.remove("error"), 450);
            }
        });
    </script>
</body>
</html>
